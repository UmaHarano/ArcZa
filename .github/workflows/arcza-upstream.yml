name: ArcZa Upstream Updates

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: arcza-upstream-updates
  cancel-in-progress: false

jobs:
  propose-update:
    if: github.repository == 'UmaHarano/ArcZa'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ARCZA_SYNC_TOKEN || github.token }}
      - name: Test updater safeguards
        run: bash .github/scripts/arcza-upstream.test.sh
      - name: Propose update and enable guarded auto-merge
        env:
          GH_TOKEN: ${{ secrets.ARCZA_SYNC_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: bash .github/scripts/arcza-upstream.sh